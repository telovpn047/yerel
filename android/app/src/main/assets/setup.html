<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yakyn</title>
<style>
:root { --acc:#2B59C3; --acc2:#5b86e5; --bg:#f3f5f9; --card:#fff; --tx:#141a24; --tx2:#5d6878; --line:#e1e6ee; --bad:#d93a3a; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --acc:#5b86e5; --acc2:#8fb0ff; --bg:#0d121a; --card:#121822; --tx:#e6eaf1; --tx2:#9aa6b8; --line:#263042; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font: 15px/1.45 system-ui, Roboto, sans-serif; background: var(--bg); color: var(--tx); display: flex; align-items: center; justify-content: center; padding: 24px; }
.wrap { width: 100%; max-width: 380px; text-align: center; }
.logo { width: 84px; height: 84px; border-radius: 26px; margin: 0 auto 18px; display: grid; place-items: center;
  background: linear-gradient(145deg, var(--acc2), var(--acc)); box-shadow: 0 14px 36px rgba(43,89,195,.35); }
.logo svg { width: 46px; height: 46px; }
h1 { font-size: 28px; margin: 0; letter-spacing: -.3px; }
.sub { color: var(--tx2); margin: 8px 0 26px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px; text-align: left; }
label { display: block; font-size: 13px; font-weight: 600; color: var(--tx2); margin: 0 0 8px 2px; }
input { width: 100%; height: 50px; padding: 0 16px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--bg); color: var(--tx); font: inherit; font-size: 17px; outline: none; }
input:focus { border-color: var(--acc); }
button { width: 100%; height: 50px; margin-top: 14px; border-radius: 14px; border: 0; background: var(--acc); color: #fff; font: 600 16px system-ui, sans-serif; }
button:disabled { opacity: .5; }
.hint { color: var(--tx2); font-size: 12.5px; margin-top: 12px; line-height: 1.5; }
.radar { position: relative; width: 140px; height: 140px; margin: 6px auto 22px; }
.radar i { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--acc); opacity: 0; animation: ping 2.4s ease-out infinite; }
.radar i:nth-child(2) { animation-delay: .8s; }
.radar i:nth-child(3) { animation-delay: 1.6s; }
.radar b { position: absolute; inset: 46px; border-radius: 50%; background: linear-gradient(145deg, var(--acc2), var(--acc)); }
@keyframes ping { 0% { transform: scale(.35); opacity: .9; } 100% { transform: scale(1); opacity: 0; } }
.st { font-size: 16px; font-weight: 600; min-height: 24px; }
.st.err { color: var(--bad); }
.small { color: var(--tx2); font-size: 13px; margin-top: 8px; }
#retry { display: none; max-width: 220px; margin: 18px auto 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 3C6.48 3 2 6.94 2 11.8c0 2.4 1.1 4.57 2.88 6.16L4 21.5l4.1-1.86c1.2.41 2.52.66 3.9.66 5.52 0 10-3.94 10-8.5S17.52 3 12 3z"/></svg></div>
  <h1>Yakyn</h1>

  <div id="nameView" hidden>
    <p class="sub">Aynı Wi-Fi'daki herkesle internetsiz mesajlaş.</p>
    <div class="card">
      <label for="name">Adın</label>
      <input id="name" maxlength="40" autocomplete="name" placeholder="ör. Yakup" enterkeyhint="go">
      <button id="go" disabled>Başla</button>
      <p class="hint">Diğerleri seni bu adla görecek. IP, şifre veya kurulum yok — ağdaki kişiler otomatik bulunur.</p>
    </div>
  </div>

  <div id="statusView" hidden>
    <p class="sub">Aynı Wi-Fi'daki kişiler aranıyor</p>
    <div class="radar"><i></i><i></i><i></i><b></b></div>
    <div class="st" id="st">Hazırlanıyor…</div>
    <div class="small">Telefonların aynı Wi-Fi'a (veya aynı hotspot'a) bağlı olması yeterli.</div>
    <button id="retry">Tekrar dene</button>
  </div>
</div>
<script>
var A = window.YerelApp;
var $ = function (id) { return document.getElementById(id); };
function showStatus() { $("nameView").hidden = true; $("statusView").hidden = false; if (A && A.status()) onStatus(A.status(), false); }
window.onStatus = function (s, err) {
  $("st").textContent = s;
  $("st").className = "st" + (err ? " err" : "");
  $("retry").style.display = err ? "block" : "none";
};
$("name").oninput = function () { $("go").disabled = !this.value.trim(); };
function go() { var v = $("name").value.trim(); if (!v || !A) return; A.setName(v); showStatus(); }
$("go").onclick = go;
$("name").onkeydown = function (e) { if (e.key === "Enter") go(); };
$("retry").onclick = function () { onStatus("Tekrar aranıyor…", false); if (A) A.retry(); };
if (A && A.needName()) { $("nameView").hidden = false; setTimeout(function () { $("name").focus(); }, 300); }
else showStatus();
</script>
</body>
</html>
