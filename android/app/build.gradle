plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yakyn.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.yakyn.app'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '2.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
                cppFlags ''
            }
        }
    }

    ndkVersion '27.3.13750724'

    externalNativeBuild {
        cmake {
            path file('CMakeLists.txt')
            version '3.22.1'
        }
    }

    packagingOptions {
        jniLibs { useLegacyPackaging true }
    }

    signingConfigs {
        release {
            storeFile file('yerel.jks')
            storePassword 'yerel123'
            keyAlias 'yerel'
            keyPassword 'yerel123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
